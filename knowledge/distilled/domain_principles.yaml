- principle_id: low_re_nonreciprocal_actuation
  domain: low-Reynolds-number swimming
  triggers:
    keywords:
      - Re
      - Reynolds
      - low Reynolds
      - low-Re
      - 雷诺数
      - 低雷诺数
      - 微型游动
      - 微尺度游动
      - reciprocal
      - nonreciprocal
      - 非互易
      - 往复摆动
      - 对称往复
  internal_guidance:
    - In low-Reynolds-number or micro-swimmer settings, purely reciprocal shape changes are a weak propulsion strategy because the stroke can largely retrace itself.
    - Prefer reasoning in terms of nonreciprocal deformation cycles, phase differences, traveling waves, or other time-asymmetric actuation patterns.
  design_implications:
    - Do not recommend only symmetric back-and-forth actuation for low-Re swimmers.
    - Suggest phase-shifted, traveling-wave, or multi-mode actuation when discussing propulsion design.
    - Explain the idea as a physical design principle, not as a literature citation, unless references are requested.
  forbidden_user_facing_phrases:
    - 根据 Purcell
    - Purcell 1977
    - 论文指出
    - 文献表明
  source_ids:
    - purcell_1977_life_at_low_reynolds_number
    - low_re_swimming_principle_notes
  confidence: high

- principle_id: traveling_wave_swimmer_parameterization
  domain: soft-swimmer parameterization
  triggers:

- principle_id: flow_optimization_tradeoff
  domain: flow-field optimization
  triggers:
    keywords:
      - 优化
      - trade-off
      - tradeoff
      - 多目标
      - 速度
      - 能耗
      - 稳定性
      - 阻力
      - 压降
      - efficiency
      - energy
      - stability
      - drag
      - pressure drop
  internal_guidance:
    - Flow optimization usually involves trade-offs among speed, energy cost, stability, drag, pressure drop, mixing, lift, or thermal performance.
    - Avoid optimizing one metric in isolation unless the user explicitly sets single-objective priority.
  design_implications:
    - Name target metric and constraints separately.
    - Suggest Pareto-style comparison, feasibility filtering, and local refinement around promising candidates.
  forbidden_user_facing_phrases:
    - 根据文献
    - according to the literature
  source_ids:
    - flow_optimization_tradeoff_notes
  confidence: medium

- principle_id: active_flow_control_formulation
  domain: active flow control
  triggers:
    keywords:
      - 闭环控制
      - 闭环
      - active flow control
      - flow control
      - 控制律
      - observation
      - action
      - reward
      - constraint
      - actuator
      - sensor
      - 观测
      - 动作
      - 奖励
      - 约束
  internal_guidance:
    - Closed-loop flow control should be decomposed into observation, action, reward or objective, constraints, and update cadence.
    - Treat the controller and simulator interface as part of the experiment design.
  design_implications:
    - Ask what is observed, what can be actuated, what the reward/target metric is, and what safety or physical constraints apply.
    - Avoid jumping directly to a simulator run before the control formulation is clarified.
  forbidden_user_facing_phrases:
    - 论文指出
    - 根据知识库
  source_ids:
    - active_flow_control_formulation_notes
  confidence: medium

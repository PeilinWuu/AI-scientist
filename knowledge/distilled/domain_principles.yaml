- principle_id: fsi_boundary_awareness
  domain: fluid-structure interaction
  triggers:
    keywords:
      - FSI
      - fluid-structure
      - fluid structure
      - 流固耦合
      - Navier-Stokes
      - 边界条件
      - 材料
      - 疲劳
      - 结构
      - 弹性
      - deformation
      - 柔性
  internal_guidance:
    - For FSI tasks, separate fluid model, structural model, boundary conditions, material assumptions, actuation, and solver capability.
    - Be explicit about current prototype boundaries when a full CFD/FSI/material-fatigue problem is beyond the lightweight demo tool.
  design_implications:
    - Ask for or define fluid domain, boundary conditions, body geometry, material parameters, actuation law, and measured outputs.
    - Do not imply the current soft-swimmer virtual experiment solves full Navier-Stokes/FSI/material fatigue.
  forbidden_user_facing_phrases:
    - 根据文献
    - 论文指出
    - according to the literature
  source_ids:

      - 频率
      - 波长
      - 相位
      - 刚度
      - traveling wave
      - 行波
  internal_guidance:
    - For soft swimmers, formulate first-round experiments with waveform-level variables rather than vague morphology labels.
    - Useful first variables include amplitude, frequency, wavelength, phase offset, and body or actuator stiffness.
  design_implications:
    - When the user asks which variables to scan, name amplitude, frequency, wavelength, phase, and stiffness.
    - Connect these variables to speed, energy cost, stability, and efficiency trade-offs.
    - Keep the current soft-swimmer demo framed as low-fidelity unless the user only asks for a demo run.
  forbidden_user_facing_phrases:

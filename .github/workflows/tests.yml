name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m coverage run --source=src.ai_scientist.competition_schemas,src.ai_scientist.competition_runtime,src.ai_scientist.tools.execution_adapter -m pytest -q tests/ai_scientist/test_competition_execution.py
      - run: python -m coverage report --fail-under=75
